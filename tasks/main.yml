---
- name: Create Vector user
  ansible.builtin.user:
    name: "{{ vector_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Vector installation directory
  ansible.builtin.file:
    path: "{{ vector_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Vector configuration directory
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Vector data directory
  ansible.builtin.file:
    path: "{{ vector_data_dir }}"
    state: directory
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0755"

- name: Download Vector
  ansible.builtin.get_url:
    url: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz"
    dest: "{{ vector_archive_path }}"
    mode: "0644"

- name: Unpack Vector
  ansible.builtin.unarchive:
    src: "{{ vector_archive_path }}"
    dest: "{{ vector_install_dir }}"
    remote_src: true
    creates: "{{ vector_binary_path }}"

- name: Create Vector binary symlink
  ansible.builtin.file:
    src: "{{ vector_binary_path }}"
    dest: /usr/local/bin/vector
    state: link
    force: true
  notify: Restart Vector

- name: Deploy Vector configuration
  ansible.builtin.template:
    src: vector.yml.j2
    dest: "{{ vector_config_dir }}/vector.yml"
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0644"
  notify: Restart Vector

- name: Deploy Vector systemd service
  ansible.builtin.template:
    src: vector.service.j2
    dest: "{{ vector_service_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Vector

- name: Enable and start Vector
  ansible.builtin.systemd:
    name: vector
    enabled: true
    state: started
    daemon_reload: true
  when: vector_manage_service
